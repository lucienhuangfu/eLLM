site_name: eLLM Docs
site_description: Documentation restructured for MkDocs using the vLLM navigation pattern.
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true
dev_addr: 127.0.0.1:8000

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting_started/quickstart.md
      - Installation: getting_started/installation.md
  - Inference and Serving:
      - Offline Inference: serving/offline_inference.md
      - Online Serving: serving/online_serving.md
      - OpenAI Compatible Server: serving/openai_compatible_server.md
      - Serving Overview: serving/index.md
  - Deployment:
      - Overview: deployment/index.md
  - Configuration:
      - Overview: configuration/index.md
      - Environment Variables: configuration/env_vars.md
      - Optimization: configuration/optimization.md
  - Features: features/index.md
  - Developer Guide:
      - Overview: contributing/index.md
      - Model Implementation: contributing/model/basic.md
      - New Operator: contributing/new_operator.md
      - Hugging Face Alignment: contributing/hf_alignment.md
      - CI: contributing/ci/index.md
  - Design Documents: design/index.md
  - CLI Reference:
      - Overview: cli/index.md
      - Serve: cli/serve.md
      - Streaming Chat: cli/chat.md
  - Glossary: reference/glossary.md
  - Governance: governance/index.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list
